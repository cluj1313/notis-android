plugins { id 'com.android.application' }
def sp = new Properties()
def spf = rootProject.file('signing.properties')
if (spf.exists()) spf.withInputStream { sp.load(it) }
android {
    namespace 'ro.cluj1313.notis'
    compileSdk 36
    defaultConfig {
        applicationId 'ro.cluj1313.notis'
        minSdk 26
        targetSdk 36
        versionCode 115
        versionName '2.14.1'
        /* -Pplay=true -> Google Play bundle: built-in GitHub updater disabled */
        buildConfigField 'boolean', 'PLAY', (project.findProperty('play') == 'true') ? 'true' : 'false'
    }
    signingConfigs {
        release {
            if (sp['storeFile']) {
                storeFile file(sp['storeFile']); storePassword sp['storePassword']
                keyAlias sp['keyAlias']; keyPassword sp['keyPassword']
                enableV1Signing true; enableV2Signing true; enableV3Signing true
            }
        }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
