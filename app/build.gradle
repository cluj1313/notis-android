plugins { id 'com.android.application' }
def sp = new Properties()
def spf = rootProject.file('signing.properties')
if (spf.exists()) spf.withInputStream { sp.load(it) }
android {
    namespace 'ro.cluj1313.notis'
    compileSdk 35
    defaultConfig {
        applicationId 'ro.cluj1313.notis'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '2.0.1'
    }
    signingConfigs {
        release {
            if (sp['storeFile']) {
                storeFile file(sp['storeFile']); storePassword sp['storePassword']
                keyAlias sp['keyAlias']; keyPassword sp['keyPassword']
                enableV1Signing true; enableV2Signing true; enableV3Signing true
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    testOptions { unitTests.returnDefaultValues = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
